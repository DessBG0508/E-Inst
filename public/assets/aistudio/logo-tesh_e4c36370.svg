<svg xmlns="http://www.w3.org/2000/svg" viewBox="300 -10 1545 1400" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Logo balanza de la justicia con monograma TESH y circuitos</title>
  <defs>
    <style>
      .g{fill:#B8892B}
      .gs{fill:none;stroke:#B8892B;stroke-linecap:round;stroke-linejoin:round}
      .n{fill:none;stroke:#2D5B3F;stroke-linecap:round;stroke-linejoin:round}
      .nf{fill:#2D5B3F}
    </style>

    <!-- Cortes (huecos reales para que quede transparente) -->
    <mask id="mBeam" maskUnits="userSpaceOnUse" x="300" y="100" width="780" height="300">
      <rect x="300" y="100" width="780" height="300" fill="#fff"/>
      <path d="M655 292 C 720 268 780 240 850 222 C 900 211 945 220 975 245" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
    </mask>
    <mask id="mPan" maskUnits="userSpaceOnUse" x="320" y="880" width="540" height="200">
      <rect x="320" y="880" width="540" height="200" fill="#fff"/>
      <path d="M392 947 H798" stroke="#000" stroke-width="6" stroke-linecap="round"/>
      <path d="M418 976 H446 L528 1032 C480 1020 440 1002 418 976 Z" fill="#000"/>
      <path d="M772 976 H744 L662 1032 C710 1020 750 1002 772 976 Z" fill="#000"/>
    </mask>
    <mask id="mE" maskUnits="userSpaceOnUse" x="900" y="440" width="320" height="220">
      <rect x="900" y="440" width="320" height="220" fill="#fff"/>
      <rect x="1045" y="533" width="50" height="38" fill="#000"/>
    </mask>

    <!-- Mitad izquierda (se espeja para la derecha) -->
    <g id="half">
      <!-- brazo de la balanza -->
      <g mask="url(#mBeam)">
        <path class="g" d="M1005 262 C 945 200 860 195 770 234 C 700 265 640 302 590 304 C 650 326 712 288 782 260 C 860 230 930 236 990 280 Z"/>
      </g>
      <!-- voluta del extremo -->
      <path class="gs" stroke-width="17" d="M592 303 C 540 303 520 272 530 246 C 541 216 592 207 611 237 C 626 262 602 286 577 272 C 562 263 566 246 580 241"/>

      <!-- voluta central -->
      <path class="gs" stroke-width="17" d="M985 368 C 930 398 880 362 880 336 C 880 306 920 296 941 316 C 956 336 936 358 915 346"/>
      <path class="gs" stroke-width="15" d="M958 300 C 985 310 1005 340 1018 378 C 1026 405 1030 425 1033 447"/>
      <path class="gs" stroke-width="14" d="M988 182 C 1006 192 1014 214 1012 262"/>
      <circle class="g" cx="990" cy="182" r="9"/>
      <path class="n" stroke-width="9" d="M962 392 C 1000 412 1014 430 1022 447"/>

      <!-- hojas junto a la E -->
      <path class="g" d="M812 418 C 880 428 910 470 902 540 C 898 585 920 612 948 620 V 636 C 890 634 848 600 848 545 C 848 500 835 440 812 418 Z"/>

      <!-- punto verde -->
      <circle class="nf" cx="835" cy="330" r="14"/>

      <!-- circuitos superiores -->
      <circle class="n" stroke-width="10" cx="568" cy="160" r="17"/>
      <path class="n" stroke-width="10" d="M585 160 H652 L688 197 H760 L796 230"/>
      <circle class="n" stroke-width="10" cx="708" cy="126" r="17"/>
      <path class="n" stroke-width="10" d="M725 126 H778 L860 206"/>

      <!-- plato: argolla, cuerdas y cuerpo -->
      <circle class="gs" stroke-width="10" cx="595" cy="360" r="20"/>
      <path class="gs" stroke-width="18" d="M583 392 L392 888"/>
      <path class="gs" stroke-width="18" d="M608 392 L802 888"/>
      <path class="g" d="M585 392 H604 V918 H585 Z"/>
      <g mask="url(#mPan)">
        <rect class="g" x="336" y="918" width="516" height="26" rx="13"/>
        <path class="g" d="M362 944 C 420 1030 510 1062 595 1062 C 680 1062 770 1030 828 944 Z"/>
      </g>
      <circle class="gs" stroke-width="10" cx="381" cy="905" r="17"/>
      <circle class="gs" stroke-width="10" cx="808" cy="905" r="17"/>

      <!-- circuitos inferiores -->
      <circle class="n" stroke-width="10" cx="903" cy="1035" r="17"/>
      <path class="n" stroke-width="12" d="M903 1052 V1262 Q903 1278 887 1278 H832 L788 1322 H742"/>
      <circle class="n" stroke-width="10" cx="720" cy="1325" r="17"/>
      <circle class="n" stroke-width="10" cx="840" cy="1128" r="17"/>
      <path class="n" stroke-width="12" d="M856 1142 L896 1184"/>
      <path class="n" stroke-width="14" d="M800 1325 H992"/>

      <!-- serif inferior de la H -->
      <path class="g" d="M948 1050 H1000 V1290 H928 C 938 1286 948 1280 948 1262 Z"/>
    </g>
  </defs>

  <!-- Mitad izquierda y espejo derecho -->
  <use href="#half"/>
  <use href="#half" transform="translate(2140 0) scale(-1 1)"/>

  <!-- ===== Centro: monograma T-E-S-H sobre el bastón ===== -->
  <!-- bola superior y cuello -->
  <circle class="g" cx="1070" cy="52" r="31"/>
  <rect class="g" x="1059" y="76" width="22" height="26"/>
  <!-- T -->
  <path class="g" d="M883 97 H1259 V179 H1237 C1228 156 1205 147 1180 147 H1095 V348 H1045 V147 H960 C935 147 912 156 905 179 H883 Z"/>

  <!-- E -->
  <g mask="url(#mE)">
    <path class="g" d="M928 465 H1197 V541 H1184 C1180 524 1165 515 1148 515 H1000 V586 H1170 V636 H1000 V700 H948 V480 Q948 468 928 465 Z"/>
  </g>

  <!-- tallo central (I) con huecos alrededor de la S -->
  <path class="g" d="M1045 655 H1095 V855 L1045 833 Z"/>
  <path class="g" d="M1045 928 L1095 946 V1100 H1045 Z"/>
  <path class="g" d="M1045 1190 H1095 V1300 H1045 Z"/>

  <!-- S -->
  <path class="gs" stroke-width="56" stroke-linecap="butt" d="M1172 778 C 1162 738 1130 722 1090 722 C 1015 722 972 760 975 805 C 978 850 1010 868 1075 892 C 1140 916 1170 945 1166 990 C 1161 1034 1125 1052 1070 1052 H 1010"/>
  <path class="g" d="M948 940 H1000 V1060 H948 Z"/>

  <!-- H -->
  <path class="g" d="M1145 1050 H1197 V1262 C1197 1280 1207 1286 1218 1290 H1145 Z"/>
  <path class="g" d="M1000 1120 H1145 V1170 H1000 Z"/>

  <!-- bola inferior -->
  <circle class="g" cx="1070" cy="1320" r="42"/>

  <!-- serpientes (caduceo) -->
  <circle class="nf" cx="858" cy="662" r="22"/>
  <path class="n" stroke-width="12" d="M876 680 C 906 702 913 732 906 772 C 894 832 906 892 990 936"/>
  <circle class="nf" cx="1282" cy="662" r="22"/>
  <path class="n" stroke-width="12" d="M1264 682 C 1236 704 1232 732 1243 772 C 1255 820 1250 850 1210 860 C 1172 866 1142 846 1135 822"/>
  <path class="n" stroke-width="12" d="M1205 862 C 1235 886 1243 915 1240 946"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
